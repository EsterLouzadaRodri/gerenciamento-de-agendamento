spring.application.name=api

server.port=8088

# ==========================================
# Spring Security config
# ==========================================
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

#
#  Banco de dados em emmória para produção
#
spring.datasource.url=jdbc:postgresql://localhost:3333/banco
spring.datasource.username=usuario
spring.datasource.password=senha

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect



# Caminho da documentaÃ§Ã£o OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Caminho da interface Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# OrdenaÃ§Ã£o das operaÃ§Ãµes
springdoc.swagger-ui.operations-sorter=method

# OrdenaÃ§Ã£o das tags
springdoc.swagger-ui.tags-sorter=alpha

# Expande os detalhes das operaÃ§Ãµes
springdoc.swagger-ui.doc-expansion=none