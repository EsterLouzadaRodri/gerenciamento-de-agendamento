spring.application.name=agendamento

server.port=8081
# ===============================
# CONFIGURA��O DO POSTGRES
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:3333/banco
spring.datasource.username=usuario
spring.datasource.password=senha

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# ==========================================
# SWAGGER / OPENAPI
# ==========================================

# Caminho da documentação OpenAPI
springdoc.api-docs.path=/v3/api-docs

# Caminho da interface Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# Ordenação das operações
springdoc.swagger-ui.operations-sorter=method

# Ordenação das tags
springdoc.swagger-ui.tags-sorter=alpha

# Expande os detalhes das operações
springdoc.swagger-ui.doc-expansion=none

# ==========================================
# INICIALIZA��O DO BANCO
# ==========================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true


# ==========================================
# SERVIDOR
# ==========================================

# ==========================================
# Spring Security config
# ==========================================

spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN